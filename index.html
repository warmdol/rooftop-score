<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>옥상 악보 — 받아 적는 연주자들</title>
<style>
  :root {
    --ink: #f2efe9;
    --dim: #b8b2a6;
    --accent: #ffd97a;
    --bg: #0d0f14;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }

  #stage { position:fixed; inset:0; overflow:hidden; touch-action:none; }
  #bgImg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; user-select:none; pointer-events:none; }
  #bgVideo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }
  #arLayer { position:absolute; inset:0; will-change:transform; }
  #ropeCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---------- fragments ---------- */
  .frag { position:absolute; transform-origin:50% -6px; will-change:transform; cursor:grab; }
  .frag .peg { position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:10px; height:16px; border-radius:3px; background:#c9b79b; box-shadow:0 1px 2px rgba(0,0,0,.5); }
  .frag.polaroid { background:#faf7f0; padding:5px 5px 16px; border-radius:2px;
    box-shadow:0 6px 14px rgba(0,0,0,.55); }
  .frag.polaroid img { display:block; width:86px; height:86px; object-fit:cover; }
  .frag.ribbon { background:rgba(250,247,240,.16); border:1px solid rgba(250,247,240,.35);
    backdrop-filter: blur(2px); border-radius:3px; padding:4px; box-shadow:0 6px 14px rgba(0,0,0,.45); }
  .frag.ribbon canvas { display:block; width:110px; height:44px; }
  .frag.cutout { background:transparent; padding:0; box-shadow:none;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.55)); }
  .frag.cutout img { display:block; max-width:130px; max-height:130px; }

  /* ---------- 오리기 시트 ---------- */
  #cutSheet { position:fixed; inset:0; z-index:55; background:rgba(8,9,13,.96); display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px; }
  #cutSheet .msg { font-size:13px; color:var(--accent); text-align:center; }
  #cutCanvas { max-width:94vw; max-height:62vh; border-radius:8px; touch-action:none;
    box-shadow:0 8px 30px rgba(0,0,0,.6); }
  #cutSheet .row { display:flex; gap:8px; }
  #cutSheet button { padding:11px 16px; border-radius:13px; font-size:13.5px;
    border:1px solid rgba(255,255,255,.22); background:#1b1e27; color:var(--ink); }
  #cutSheet button.primary { background:var(--accent); color:#1a1508; border-color:transparent; font-weight:700; }
  .frag .del { position:absolute; top:-30px; right:-12px; width:24px; height:24px; border-radius:50%;
    background:rgba(20,20,20,.85); color:#fff; border:1px solid #666; font-size:13px; line-height:22px;
    text-align:center; display:none; }
  .frag.selected .del { display:block; }
  @keyframes sway { 0%{ transform:rotate(var(--r0)); } 50%{ transform:rotate(var(--r1)); } 100%{ transform:rotate(var(--r0)); } }
  .frag { animation: sway 3.2s ease-in-out infinite; }
  .frag.ringing { filter: drop-shadow(0 0 14px var(--accent)) brightness(1.25); animation-duration:1.1s; }

  #playhead { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 18px 4px rgba(255,217,122,.8); display:none; pointer-events:none; }

  /* ---------- top bar ---------- */
  #topbar { position:fixed; top:0; left:0; right:0; padding:10px 14px;
    display:flex; align-items:center; gap:10px; z-index:30;
    background:linear-gradient(rgba(10,10,14,.85), rgba(10,10,14,0)); }
  #topbar h1 { font-size:15px; font-weight:600; letter-spacing:.5px; }
  #topbar .sub { font-size:11px; color:var(--dim); }
  #hint { position:fixed; top:52px; left:0; right:0; text-align:center; z-index:30;
    font-size:13px; color:var(--accent); text-shadow:0 1px 4px #000; padding:0 20px; }

  /* ---------- bottom bar ---------- */
  #toolbar { position:fixed; bottom:0; left:0; right:0; z-index:30; padding:10px 12px 18px;
    display:flex; gap:8px; justify-content:center;
    background:linear-gradient(rgba(10,10,14,0), rgba(10,10,14,.9)); }
  button.tool { flex:0 1 auto; min-width:64px; padding:10px 12px; border-radius:14px;
    border:1px solid rgba(255,255,255,.22); background:rgba(24,26,34,.85); color:var(--ink);
    font-size:13px; line-height:1.25; }
  button.tool:active { background:rgba(60,64,80,.9); }
  button.tool.primary { background:var(--accent); color:#1a1508; border-color:transparent; font-weight:700; }
  button.tool:disabled { opacity:.35; }

  /* ---------- setup overlay ---------- */
  #setup { position:fixed; inset:0; z-index:40; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; text-align:center; }
  #setup h1 { font-size:22px; font-weight:700; }
  #setup p { font-size:13px; color:var(--dim); line-height:1.7; max-width:340px; }
  #setup button { width:min(320px, 86vw); padding:15px; border-radius:16px; font-size:15px;
    border:1px solid rgba(255,255,255,.2); background:#1b1e27; color:var(--ink); }
  #setup button.primary { background:var(--accent); color:#1a1508; border-color:transparent; font-weight:700; }

  /* ---------- record sheet ---------- */
  #recSheet { position:fixed; left:0; right:0; bottom:0; z-index:50; display:none;
    background:#15171f; border-radius:20px 20px 0 0; padding:22px 20px 30px; text-align:center; }
  #recSheet .big { font-size:30px; font-weight:700; color:var(--accent); margin:8px 0; }
  #recSheet button { margin-top:10px; padding:12px 30px; border-radius:14px; border:none;
    background:#e5533d; color:#fff; font-size:15px; font-weight:600; }

  #toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); z-index:60;
    background:rgba(20,22,30,.92); border:1px solid rgba(255,255,255,.18); color:var(--ink);
    padding:9px 16px; border-radius:12px; font-size:12.5px; display:none; max-width:86vw; }

  input[type=file] { display:none; }
</style>
</head>
<body>

<div id="stage">
  <video id="bgVideo" autoplay playsinline muted style="display:none"></video>
  <img id="bgImg" alt="" style="display:none">
  <div id="arLayer">
    <canvas id="ropeCanvas"></canvas>
    <div id="playhead"></div>
  </div>
</div>

<div id="topbar" style="display:none">
  <h1>옥상 악보</h1><span class="sub" id="mode-label"></span>
</div>
<div id="hint" style="display:none"></div>

<div id="toolbar" style="display:none">
  <button class="tool" id="btnPhoto">📷<br>찍어 널기</button>
  <button class="tool" id="btnRec">🎙<br>녹음해 널기</button>
  <button class="tool primary" id="btnPlay">▶<br>연주</button>
  <button class="tool" id="btnDemo">✚<br>데모</button>
  <button class="tool" id="btnCal">↺<br>재보정</button>
</div>

<div id="setup">
  <h1>옥상 악보</h1>
  <p>빨랫줄을 화면에 담고 손가락으로 줄을 따라 그으면, 줄이 악보가 됩니다.<br>
     사진과 소리를 채집해 줄에 널고, 왼쪽부터 연주하세요.</p>
  <button class="primary" id="setupLive">📱 카메라로 줄 비추기 (AR)</button>
  <button id="setupPhoto">🖼 줄 사진으로 시작</button>
  <button id="setupDemo">✨ 데모 이미지로 시작</button>
  <p id="setupNote" style="font-size:11px"></p>
</div>

<div id="cutSheet">
  <div class="msg">널고 싶은 것의 둘레를 손가락으로 따라 그리세요</div>
  <canvas id="cutCanvas"></canvas>
  <div class="row">
    <button id="cutRetry">↺ 다시</button>
    <button id="cutRect">사각형 그대로</button>
    <button id="cutOk" class="primary" disabled>✂ 오려 널기</button>
  </div>
</div>

<div id="recSheet">
  <div>소리를 채집하는 중</div>
  <div class="big" id="recCount">5.0</div>
  <button id="recStop">그만 담기</button>
</div>

<div id="toast"></div>

<input type="file" id="fileRope" accept="image/*">
<input type="file" id="fileFrag" accept="image/*" capture="environment">

<script>
'use strict';
/* =========================================================
   옥상 악보 — 기능 프로토타입 v0.1
   - 줄 보정: 양 끝 2탭 → 처진 곡선(포물선 근사)
   - 조각: 사진(폴라로이드) / 녹음(파형 리본)
   - 위치 = 줄 좌표 t(0..1), 높이 = 음높이(펜타토닉)
   - 연주: 재생 헤드가 곡선을 따라 왼→오, 조각 통과 시 발음
   ========================================================= */

const $ = id => document.getElementById(id);
const stage = $('stage'), arLayer = $('arLayer'), ropeCanvas = $('ropeCanvas'), ctx = ropeCanvas.getContext('2d');

/* ---------- 자이로 정합 (LIVE 모드) ----------
   보정 시점의 기기 방향을 기준으로, 팬/틸트한 만큼 오버레이를 반대로 이동 */
const gyro = { ref:null, cur:null, dx:0, dy:0 };
window.addEventListener('deviceorientation', e=>{
  if(e.alpha==null) return;
  gyro.cur = { a:e.alpha, b:e.beta };
});
function wrapDeg(d){ while(d>180)d-=360; while(d<-180)d+=360; return d; }
const FOV_X = 52, FOV_Y = 66; // 대략적 카메라 화각(도)
function gyroApply(){
  if(state.mode==='live' && gyro.ref && gyro.cur){
    const {w,h}=px();
    const tx = wrapDeg(gyro.cur.a - gyro.ref.a) * (w/FOV_X);
    const ty = (gyro.cur.b - gyro.ref.b) * (h/FOV_Y);
    gyro.dx += (tx - gyro.dx)*0.35;
    gyro.dy += (ty - gyro.dy)*0.35;
  } else { gyro.dx += (0-gyro.dx)*0.35; gyro.dy += (0-gyro.dy)*0.35; }
  arLayer.style.transform = `translate(${gyro.dx.toFixed(1)}px, ${gyro.dy.toFixed(1)}px)`;
}
async function askGyroPermission(){
  try{
    if(window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission){
      await DeviceOrientationEvent.requestPermission();
    }
  }catch(e){ /* 거부 시 정합 없이 진행 */ }
}
/* 화면 좌표 → AR 레이어 좌표 (오버레이 이동분 보정) */
function arPt(clientX, clientY){
  const r=stage.getBoundingClientRect();
  return { x: clientX - r.left - gyro.dx, y: clientY - r.top - gyro.dy };
}

const state = {
  mode: null,            // 'live' | 'photo'
  curvePts: null,        // [{fx,fy} x48] 트레이스된 줄 곡선 (화면 비율 좌표)
  frags: [],             // {id, t, kind:'photo'|'sound', el, img?, buffer?}
  placing: null,         // 배치 대기 조각
  calibrating: false,
  playing: false,
  selected: null,
};
let audioCtx = null;
const PENTA = [0,2,4,7,9,12,14,16,19,21]; // C 펜타토닉 2옥타브 (반음 오프셋)
const BASE_FREQ = 220; // A3 기준

/* ---------- 유틸 ---------- */
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none', ms); }
function hint(msg){ const h=$('hint'); if(!msg){h.style.display='none';return;} h.textContent=msg; h.style.display='block'; }
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function px(){ return { w: stage.clientWidth, h: stage.clientHeight }; }

/* ---------- 줄(곡선): 손가락 트레이스 기반 ---------- */
const trace = { active:false, pts:[] };

function ready(){ return !!state.curvePts; }
function curveScreenPts(){
  const {w,h}=px();
  return state.curvePts.map(p=>({x:p.fx*w, y:p.fy*h}));
}
function curvePoint(t){
  const P=curveScreenPts();
  const f=Math.min(1,Math.max(0,t))*(P.length-1);
  const i=Math.min(P.length-2, Math.floor(f)), u=f-i;
  return { x:P[i].x+(P[i+1].x-P[i].x)*u, y:P[i].y+(P[i+1].y-P[i].y)*u };
}
function nearestT(x,y){
  let best=0, bd=1e9;
  for(let t=0;t<=1.0001;t+=0.004){
    const p=curvePoint(t); const d=(p.x-x)**2+(p.y-y)**2;
    if(d<bd){bd=d;best=t;}
  }
  return {t:best, dist:Math.sqrt(bd)};
}
function finishTrace(){
  const {w}=px();
  let pts=trace.pts.slice();
  trace.active=false; trace.pts=[];
  const xs=pts.map(p=>p.x);
  if(pts.length<8 || (Math.max(...xs)-Math.min(...xs)) < w*0.3){
    toast('줄 전체를 왼쪽 끝에서 오른쪽 끝까지 길게 따라 그어주세요');
    return;
  }
  if(pts[0].x > pts[pts.length-1].x) pts.reverse();
  // 스무딩 (이동평균 2회)
  for(let pass=0; pass<2; pass++){
    pts = pts.map((p,i)=>{
      const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
      return { x:(a.x+p.x+b.x)/3, y:(a.y+p.y+b.y)/3 };
    });
  }
  // 호 길이 기준 균일 리샘플 (48점)
  const N=48, seg=[0];
  for(let i=1;i<pts.length;i++) seg.push(seg[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
  const total=seg[seg.length-1];
  const out=[];
  for(let k=0;k<N;k++){
    const target=total*k/(N-1);
    let i=1; while(i<seg.length-1 && seg[i]<target) i++;
    const u=(target-seg[i-1])/Math.max(1e-6,(seg[i]-seg[i-1]));
    out.push({ x:pts[i-1].x+(pts[i].x-pts[i-1].x)*u, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*u });
  }
  const {w:W,h:H}=px();
  state.curvePts = out.map(p=>({fx:p.x/W, fy:p.y/H}));
  gyro.ref = gyro.cur ? {...gyro.cur} : null;   // 이 방향을 정합 기준으로
  state.calibrating=false; hint('');
  toast('줄이 악보가 되었습니다. 이제 채집해서 널어보세요.');
  repositionAll();
}
function drawRope(){
  const {w,h}=px();
  if(ropeCanvas.width!==w||ropeCanvas.height!==h){ ropeCanvas.width=w; ropeCanvas.height=h; }
  ctx.clearRect(0,0,w,h);
  if(trace.active && trace.pts.length>1){
    ctx.beginPath();
    ctx.moveTo(trace.pts[0].x, trace.pts[0].y);
    trace.pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.strokeStyle='rgba(255,217,122,.9)'; ctx.lineWidth=3; ctx.stroke();
    return;
  }
  if(!ready()) return;
  const P=curveScreenPts();
  ctx.beginPath();
  ctx.moveTo(P[0].x,P[0].y);
  P.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='rgba(255,217,122,.5)'; ctx.lineWidth=2; ctx.setLineDash([7,7]); ctx.stroke(); ctx.setLineDash([]);
  dot(P[0].x,P[0].y); dot(P[P.length-1].x,P[P.length-1].y);
}
function dot(x,y){ ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fillStyle='#ffd97a'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.stroke(); }

/* ---------- 음높이: 줄 위 높이 → 펜타토닉 ---------- */
function pitchAt(t){
  // 곡선의 y범위 안에서 위쪽일수록 높은 음
  let yMin=1e9,yMax=-1e9;
  for(let s=0;s<=1.0001;s+=0.02){ const y=curvePoint(s).y; yMin=Math.min(yMin,y); yMax=Math.max(yMax,y); }
  const y=curvePoint(t).y;
  const n=(yMax-y)/Math.max(1,(yMax-yMin));            // 0(최저)..1(최고)
  const idx=Math.round(n*(PENTA.length-1));
  return BASE_FREQ*Math.pow(2, PENTA[idx]/12);
}

/* ---------- 조각 ---------- */
let fragSeq=0;
function makeFragEl(cls){
  const el=document.createElement('div');
  el.className='frag '+cls;
  el.style.setProperty('--r0',(Math.random()*6-3)+'deg');
  el.style.setProperty('--r1',(Math.random()*6-3)+'deg');
  el.style.animationDelay=(-Math.random()*3)+'s';
  const peg=document.createElement('div'); peg.className='peg'; el.appendChild(peg);
  const del=document.createElement('button'); del.className='del'; del.textContent='×'; el.appendChild(del);
  arLayer.appendChild(el);
  return el;
}
function positionFrag(f){
  const p=curvePoint(f.t);
  f.el.style.left=(p.x - f.el.offsetWidth/2)+'px';
  f.el.style.top=(p.y + 8)+'px';
}
function repositionAll(){ state.frags.forEach(positionFrag); }

function addPhotoFrag(imgSrc, isCut){
  const el=makeFragEl(isCut?'cutout':'polaroid');
  const img=document.createElement('img'); img.src=imgSrc; el.insertBefore(img, el.querySelector('.del'));
  const f={id:++fragSeq, kind:'photo', t:null, el, img:imgSrc, timbre:null};
  analyzeImageTimbre(imgSrc).then(tb=>{ f.timbre=tb; });   // 이미지에서 음색 추출
  bindFrag(f);
  startPlacing(f, '줄에서 이 조각을 널 자리를 탭하세요');
}
function addSoundFrag(buffer){
  const el=makeFragEl('ribbon');
  const cv=document.createElement('canvas'); cv.width=220; cv.height=88;
  el.insertBefore(cv, el.querySelector('.del'));
  drawWaveform(cv, buffer);
  const f={id:++fragSeq, kind:'sound', t:null, el, buffer};
  bindFrag(f);
  startPlacing(f, '줄에서 이 소리를 널 자리를 탭하세요');
}
function drawWaveform(cv, buffer){
  const c=cv.getContext('2d'); c.clearRect(0,0,cv.width,cv.height);
  const data=buffer.getChannelData(0), step=Math.max(1,Math.floor(data.length/cv.width));
  c.beginPath();
  for(let x=0;x<cv.width;x++){
    let min=1,max=-1;
    for(let j=0;j<step;j++){ const v=data[x*step+j]||0; if(v<min)min=v; if(v>max)max=v; }
    const mid=cv.height/2;
    c.moveTo(x, mid+min*mid*0.92); c.lineTo(x, mid+max*mid*0.92+0.5);
  }
  c.strokeStyle='rgba(250,247,240,.95)'; c.lineWidth=1; c.stroke();
}
function startPlacing(f, msg){
  state.placing=f;
  f.el.style.opacity='0.55';
  const {w,h}=px();
  f.el.style.left=(w/2-50)+'px'; f.el.style.top=(h-230)+'px';
  hint(msg);
}
function bindFrag(f){
  // 선택/삭제/드래그
  let dragging=false, moved=false;
  f.el.addEventListener('pointerdown', e=>{
    if(f.t===null) return;
    dragging=true; moved=false; f.el.setPointerCapture(e.pointerId); e.stopPropagation();
  });
  f.el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    moved=true;
    const r=stage.getBoundingClientRect();
    const {t}=nearestT(e.clientX-r.left, e.clientY-r.top);
    f.t=t; positionFrag(f);
  });
  f.el.addEventListener('pointerup', e=>{
    if(!dragging) return; dragging=false;
    if(!moved){ // 탭 = 선택 토글
      if(state.selected && state.selected!==f) state.selected.el.classList.remove('selected');
      f.el.classList.toggle('selected');
      state.selected = f.el.classList.contains('selected') ? f : null;
    }
  });
  f.el.querySelector('.del').addEventListener('click', e=>{
    e.stopPropagation();
    state.frags=state.frags.filter(x=>x!==f); f.el.remove();
    toast('조각을 내렸습니다');
  });
}

/* ---------- 스테이지 탭: 보정 & 배치 ---------- */
stage.addEventListener('pointerdown', e=>{
  const {x,y}=arPt(e.clientX, e.clientY);

  if(state.calibrating){
    trace.active=true; trace.pts=[{x,y}];
    return;
  }

  if(state.placing){
    const {t,dist}=nearestT(x,y);
    if(dist>110){ toast('줄과 너무 멀어요 — 줄 가까이를 탭하세요'); return; }
    const f=state.placing; f.t=t; f.el.style.opacity='1';
    state.frags.push(f); state.placing=null; hint('');
    positionFrag(f);
    previewFrag(f);
  }
});
stage.addEventListener('pointermove', e=>{
  if(!trace.active) return;
  const {x,y}=arPt(e.clientX, e.clientY);
  const last=trace.pts[trace.pts.length-1];
  if(Math.hypot(x-last.x,y-last.y)>3) trace.pts.push({x,y});
});
stage.addEventListener('pointerup', ()=>{ if(trace.active) finishTrace(); });
stage.addEventListener('pointercancel', ()=>{ trace.active=false; trace.pts=[]; });

function previewFrag(f){
  ensureAudio();
  if(f.kind==='photo') playImageTone(f.timbre, pitchAt(f.t), 0.8);
  else playBuffer(f.buffer, rateAt(f.t), 1.0);
  ring(f, 900);
}
function ring(f, ms){ f.el.classList.add('ringing'); setTimeout(()=>f.el.classList.remove('ringing'), ms); }

/* ---------- 이미지 → 음색 분석 ----------
   사진의 밝기·채도·색상·질감을 읽어 그 사진만의 음색 파라미터를 만든다.
   음높이는 줄(높이)이 정하고, 음색은 이미지가 정한다. */
function analyzeImageTimbre(src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const S=48, c=document.createElement('canvas'); c.width=c.height=S;
      const g=c.getContext('2d'); g.drawImage(img,0,0,S,S);
      let d;
      try{ d=g.getImageData(0,0,S,S).data; }catch(e){ res(null); return; }
      let sumL=0,sumSat=0,hux=0,huy=0,tex=0,n=0;
      const lum=[];
      for(let i=0;i<d.length;i+=4){
        const r=d[i]/255,gr=d[i+1]/255,b=d[i+2]/255;
        if(d[i+3]<32){ lum.push(-1); continue; }   // 투명(컷아웃 바깥) 무시
        const mx=Math.max(r,gr,b), mn=Math.min(r,gr,b), L=(mx+mn)/2;
        lum.push(L); sumL+=L; n++;
        const sat=mx===0?0:(mx-mn)/mx; sumSat+=sat;
        // 색상(hue) 벡터 평균
        let hdeg=0;
        if(mx!==mn){
          if(mx===r) hdeg=60*(((gr-b)/(mx-mn))%6);
          else if(mx===gr) hdeg=60*((b-r)/(mx-mn)+2);
          else hdeg=60*((r-gr)/(mx-mn)+4);
        }
        const hr=hdeg*Math.PI/180;
        hux+=Math.cos(hr)*sat; huy+=Math.sin(hr)*sat;
      }
      if(!n){ res(null); return; }
      for(let y=0;y<S-1;y++) for(let x=0;x<S-1;x++){
        const i=y*S+x, a=lum[i];
        if(a<0) continue;
        const r1=lum[i+1], r2=lum[i+S];
        if(r1>=0) tex+=Math.abs(a-r1);
        if(r2>=0) tex+=Math.abs(a-r2);
      }
      const hue=((Math.atan2(huy,hux)*180/Math.PI)+360)%360;
      res({
        bright: sumL/n,                       // 0..1 밝기 → 필터 열림
        sat: sumSat/n,                        // 0..1 채도 → 배음/디튠
        hue,                                  // 0..360 → 파형 성격
        tex: Math.min(1, tex/n*6),            // 0..1 질감 → 노이즈·떨림
      });
    };
    img.onerror=()=>res(null);
    img.src=src;
  });
}
function playImageTone(tb, freq, dur){
  if(!tb) return playTone(freq, dur);
  const ac=ensureAudio(), t0=ac.currentTime;
  const out=ac.createGain(); out.gain.value=1; out.connect(ac.destination);
  // 파형: 색상으로 결정 (난색=거칠게, 한색=둥글게)
  const wave = tb.hue<70||tb.hue>320 ? 'sawtooth' : (tb.hue<180 ? 'triangle' : 'sine');
  const flt=ac.createBiquadFilter(); flt.type='lowpass';
  flt.frequency.value = 500 + tb.bright*4200;          // 밝을수록 열린 소리
  flt.connect(out);
  const g=ac.createGain(); g.connect(flt);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(0.42,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  const o1=ac.createOscillator(); o1.type=wave; o1.frequency.value=freq; o1.connect(g);
  const o2=ac.createOscillator(); o2.type=wave; o2.frequency.value=freq;
  o2.detune.value = 4 + tb.sat*22;                      // 채도 → 디튠 두께
  const g2=ac.createGain(); g2.gain.value=0.5; o2.connect(g2); g2.connect(g);
  // 질감 → 숨소리(노이즈)
  if(tb.tex>0.06){
    const len=ac.sampleRate*dur, nb=ac.createBuffer(1,len,ac.sampleRate), nd=nb.getChannelData(0);
    for(let i=0;i<len;i++) nd[i]=(Math.random()*2-1)*Math.exp(-i/len*4);
    const ns=ac.createBufferSource(); ns.buffer=nb;
    const ng=ac.createGain(); ng.gain.value=tb.tex*0.16;
    const nf=ac.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=freq*2.5;
    ns.connect(nf); nf.connect(ng); ng.connect(out); ns.start(t0);
  }
  // 질감 → 미세한 떨림
  const lfo=ac.createOscillator(), lg=ac.createGain();
  lfo.frequency.value=3+tb.tex*8; lg.gain.value=freq*0.006*(0.4+tb.tex);
  lfo.connect(lg); lg.connect(o1.frequency);
  o1.start(t0); o2.start(t0); lfo.start(t0);
  const tEnd=t0+dur+0.15; o1.stop(tEnd); o2.stop(tEnd); lfo.stop(tEnd);
}

/* ---------- 사운드 ---------- */
function playTone(freq, dur){
  const ac=ensureAudio(), t0=ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.value=freq;
  const o2=ac.createOscillator(), g2=ac.createGain();
  o2.type='triangle'; o2.frequency.value=freq*2; g2.gain.value=0.12;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(0.5,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
  o.start(t0); o2.start(t0); o.stop(t0+dur+0.1); o2.stop(t0+dur+0.1);
}
function rateAt(t){
  let yMin=1e9,yMax=-1e9;
  for(let s=0;s<=1.0001;s+=0.02){ const y=curvePoint(s).y; yMin=Math.min(yMin,y); yMax=Math.max(yMax,y); }
  const n=(yMax-curvePoint(t).y)/Math.max(1,(yMax-yMin));
  return 0.8 + n*0.5; // 0.8x ~ 1.3x
}
function playBuffer(buffer, rate, gain){
  const ac=ensureAudio();
  const s=ac.createBufferSource(); s.buffer=buffer; s.playbackRate.value=rate||1;
  const g=ac.createGain(); g.gain.value=gain??1;
  s.connect(g); g.connect(ac.destination); s.start();
  return s;
}

/* ---------- 연주 ---------- */
const PLAY_SECONDS = 16;
function play(){
  if(!ready()){ toast('먼저 줄을 보정하세요'); return; }
  if(!state.frags.length){ toast('널린 조각이 없습니다'); return; }
  if(state.playing) return;
  ensureAudio();
  state.playing=true; $('btnPlay').disabled=true;
  const ph=$('playhead'); ph.style.display='block';
  const played=new Set();
  const t0=performance.now();
  (function step(){
    const el=(performance.now()-t0)/1000;
    const t=Math.min(1, el/PLAY_SECONDS);
    const p=curvePoint(t);
    ph.style.left=p.x+'px'; ph.style.top=p.y+'px';
    state.frags.forEach(f=>{
      if(!played.has(f.id) && f.t<=t){
        played.add(f.id);
        if(f.kind==='photo') playImageTone(f.timbre, pitchAt(f.t), 1.3);
        else playBuffer(f.buffer, rateAt(f.t), 1.0);
        ring(f, 1200);
      }
    });
    if(t<1){ requestAnimationFrame(step); }
    else { state.playing=false; $('btnPlay').disabled=false; ph.style.display='none';
           toast('연주가 끝났습니다 — 막이 내립니다'); }
  })();
}

/* ---------- 사진 채집 ---------- */
$('btnPhoto').addEventListener('click', ()=>{
  if(!ready()) return toast('먼저 줄을 보정하세요');
  if(state.mode==='live' && window._liveVideoReady){ captureFromLive(); }
  else $('fileFrag').click();
});
$('fileFrag').addEventListener('change', e=>{
  const file=e.target.files[0]; e.target.value='';
  if(!file) return;

});
function captureFromLive(){
  const v=$('bgVideo');
  const c=document.createElement('canvas');
  const s=Math.min(900/v.videoWidth, 1);
  c.width=v.videoWidth*s; c.height=v.videoHeight*s;

}

/* ---------- 오리기 (윤곽 컷) ---------- */
const cut = { img:null, pts:[], drawing:false };
const cutCv=$('cutCanvas'), cutCtx=cutCv.getContext('2d');

function openCutter(dataUrl){
  const img=new Image();
  img.onload=()=>{
    cut.img=img; cut.pts=[];
    // 표시 크기: 화면에 맞춤
    const maxW=Math.min(innerWidth*0.94, 640), maxH=innerHeight*0.62;
    const s=Math.min(maxW/img.width, maxH/img.height, 1);
    cutCv.width=img.width*s; cutCv.height=img.height*s;
    cutCv.style.width=cutCv.width+'px'; cutCv.style.height=cutCv.height+'px';
    $('cutOk').disabled=true;
    drawCutter();
    $('cutSheet').style.display='flex';
  };
  img.src=dataUrl;
}
function drawCutter(){
  cutCtx.clearRect(0,0,cutCv.width,cutCv.height);
  cutCtx.drawImage(cut.img,0,0,cutCv.width,cutCv.height);
  if(cut.pts.length>1){
    cutCtx.save();
    // 바깥 어둡게
    if(cut.pts.length>8 && !cut.drawing){
      cutCtx.fillStyle='rgba(0,0,0,.55)';
      cutCtx.beginPath();
      cutCtx.rect(0,0,cutCv.width,cutCv.height);
      pathFrom(cutCtx, cut.pts); cutCtx.closePath();
      cutCtx.fill('evenodd');
    }
    cutCtx.beginPath(); pathFrom(cutCtx, cut.pts);
    if(!cut.drawing) cutCtx.closePath();
    cutCtx.strokeStyle='#ffd97a'; cutCtx.lineWidth=2.5; cutCtx.setLineDash([6,5]);
    cutCtx.stroke();
    cutCtx.restore();
  }
}
function pathFrom(c, pts){ c.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y); }

function cutPointer(e){
  const r=cutCv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(cutCv.width/r.width), y:(e.clientY-r.top)*(cutCv.height/r.height) };
}
cutCv.addEventListener('pointerdown', e=>{ e.preventDefault();
  cut.drawing=true; cut.pts=[cutPointer(e)]; cutCv.setPointerCapture(e.pointerId); drawCutter(); });
cutCv.addEventListener('pointermove', e=>{ if(!cut.drawing) return;
  const p=cutPointer(e), last=cut.pts[cut.pts.length-1];
  if(Math.hypot(p.x-last.x,p.y-last.y)>3) cut.pts.push(p);
  drawCutter(); });
cutCv.addEventListener('pointerup', ()=>{ cut.drawing=false;
  $('cutOk').disabled = cut.pts.length<9;
  drawCutter(); });

$('cutRetry').addEventListener('click', ()=>{ cut.pts=[]; $('cutOk').disabled=true; drawCutter(); });
$('cutRect').addEventListener('click', ()=>{
  $('cutSheet').style.display='none';
  addPhotoFrag(cut.img.src, false);
});
$('cutOk').addEventListener('click', ()=>{
  $('cutSheet').style.display='none';
  addPhotoFrag(cutoutPng(cut.img, cut.pts, cutCv.width, cutCv.height), true);
});

function cutoutPng(img, pts, dispW, dispH){
  const sx=img.width/dispW, sy=img.height/dispH;
  const P=pts.map(p=>({x:p.x*sx, y:p.y*sy}));
  // 원본 좌표 bbox (+여백)
  const pad=Math.max(img.width,img.height)*0.02;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  P.forEach(p=>{ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); });
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(img.width,x1+pad); y1=Math.min(img.height,y1+pad);
  const c=document.createElement('canvas');
  c.width=Math.max(2, x1-x0); c.height=Math.max(2, y1-y0);
  const g=c.getContext('2d');
  g.save();
  g.beginPath();
  g.moveTo(P[0].x-x0, P[0].y-y0);
  for(let i=1;i<P.length;i++) g.lineTo(P[i].x-x0, P[i].y-y0);
  g.closePath();
  g.clip();
  g.drawImage(img, -x0, -y0);
  g.restore();
  // 스티커 테두리
  g.beginPath();
  g.moveTo(P[0].x-x0, P[0].y-y0);
  for(let i=1;i<P.length;i++) g.lineTo(P[i].x-x0, P[i].y-y0);
  g.closePath();
  g.strokeStyle='rgba(250,247,240,.9)';
  g.lineWidth=Math.max(3, Math.max(c.width,c.height)*0.012);
  g.stroke();
  return c.toDataURL('image/png');
}
function shrinkImage(file, max){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(max/img.width, max/img.height, 1);
      const c=document.createElement('canvas');
      c.width=img.width*s; c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.85));
    };
    img.src=URL.createObjectURL(file);
  });
}

/* ---------- 녹음 채집 ---------- */
let recorder=null, recTimer=null;
$('btnRec').addEventListener('click', async ()=>{
  if(!ready()) return toast('먼저 줄을 보정하세요');
  ensureAudio();
  try{
    const ms=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];
    recorder=new MediaRecorder(ms);
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=async ()=>{
      ms.getTracks().forEach(t=>t.stop());
      $('recSheet').style.display='none';
      try{
        const ab=await new Blob(chunks).arrayBuffer();
        const buf=await ensureAudio().decodeAudioData(ab);
        addSoundFrag(buf);
      }catch(err){ toast('녹음 해석 실패: '+err.message); }
    };
    recorder.start();
    $('recSheet').style.display='block';
    let left=5.0;
    $('recCount').textContent=left.toFixed(1);
    recTimer=setInterval(()=>{
      left-=0.1; $('recCount').textContent=Math.max(0,left).toFixed(1);
      if(left<=0) stopRec();
    },100);
  }catch(err){
    toast('마이크를 열 수 없습니다 (HTTPS/localhost 필요): '+err.name);
  }
});
function stopRec(){ clearInterval(recTimer); if(recorder&&recorder.state!=='inactive') recorder.stop(); }
$('recStop').addEventListener('click', stopRec);

/* ---------- 데모 조각 ---------- */
let demoN=0;
$('btnDemo').addEventListener('click', ()=>{
  if(!ready()) return toast('먼저 줄을 보정하세요');
  demoN++;
  if(demoN%2===1){
    // 데모 사진: 불규칙 윤곽으로 오려진 조각
    const c=document.createElement('canvas'); c.width=c.height=300;
    const g=c.getContext('2d');
    const pts=[]; const N=14;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2;
      const r=105+Math.sin(a*3+demoN)*22+Math.cos(a*5)*12;
      pts.push({x:150+Math.cos(a)*r, y:150+Math.sin(a)*r*0.85});
    }
    g.save(); g.beginPath();
    g.moveTo(pts[0].x,pts[0].y); pts.forEach(p=>g.lineTo(p.x,p.y)); g.closePath(); g.clip();
    const grad=g.createLinearGradient(0,0,300,300);
    const hues=[[26,'#2b3a67','#e98a5e'],[1,'#494e6b','#98878f'],[2,'#1b2a49','#d0e1f9']][demoN%3];
    grad.addColorStop(0,hues[1]); grad.addColorStop(1,hues[2]);
    g.fillStyle=grad; g.fillRect(0,0,300,300);
    g.fillStyle='rgba(255,255,255,.85)'; g.font='26px sans-serif';
    g.fillText('demo', 110, 165);
    g.restore();
    g.beginPath(); g.moveTo(pts[0].x,pts[0].y); pts.forEach(p=>g.lineTo(p.x,p.y)); g.closePath();
    g.strokeStyle='rgba(250,247,240,.9)'; g.lineWidth=4; g.stroke();
    addPhotoFrag(c.toDataURL(), true);
  } else {
    // 데모 소리: 합성 버퍼 (새소리 비슷한 처프)
    const ac=ensureAudio(), sr=ac.sampleRate, len=sr*1.2;
    const buf=ac.createBuffer(1,len,sr), d=buf.getChannelData(0);
    for(let i=0;i<len;i++){
      const tt=i/sr;
      const f=600+400*Math.sin(tt*9+demoN);
      d[i]=Math.sin(2*Math.PI*f*tt)*Math.exp(-tt*2.5)*0.6*(0.6+0.4*Math.sin(tt*40));
    }
    addSoundFrag(buf);
  }
});
